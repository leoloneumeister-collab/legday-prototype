<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>VoiceLift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Phone-first gym log: sticky level header, Log/Stats tabs, one input dock pinned to the bottom. */
  :root {
    --bg: #0d1117; --surface: #151b24; --surface2: #1d2531; --line: #273143;
    --text: #e9eef5; --mute: #8996aa;
    --accent: #5aa9ff; --accent-ink: #06121f; --gold: #f5c04a; --good: #46d39a; --danger: #ff7070;
    --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5f9; --surface: #ffffff; --surface2: #e9eef5; --line: #d8dfea;
      --text: #101722; --mute: #586579;
      --accent: #1d6fd6; --accent-ink: #ffffff; --gold: #a06a05; --good: #118a5a; --danger: #c93a3a;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f5f9; --surface: #ffffff; --surface2: #e9eef5; --line: #d8dfea;
    --text: #101722; --mute: #586579;
    --accent: #1d6fd6; --accent-ink: #ffffff; --gold: #a06a05; --good: #118a5a; --danger: #c93a3a;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 var(--f-body);
    padding-block: 0 190px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
  .app { max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0 10px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font: 700 24px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
  .brand span { color: var(--accent); }
  .chips { display: flex; gap: 8px; align-items: center; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font: 600 15px/1.2 var(--f-display); letter-spacing: .04em; white-space: nowrap; }
  .chip.btn:hover { border-color: var(--accent); }
  .xpbar { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 2px; }
  .xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .5s; }
  .xplbl { display: flex; justify-content: space-between; color: var(--mute); font-size: 12px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-top: 10px; }
  .tabs button { border: 0; background: none; padding: 8px; border-radius: 9px; font: 700 16px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

  .stack { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  h2 { margin: 0 0 10px; font: 700 14px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface2); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--mute); }
  .link { background: none; border: 0; color: var(--accent); padding: 4px 0; text-decoration: underline; font-size: 14px; }

  .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gname { font: 700 22px/1.1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
  .gmeta { color: var(--mute); font-size: 13px; }
  .setrow { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .setrow:first-of-type { border-top: 0; }
  .sn { color: var(--mute); font: 600 15px var(--f-display); }
  .sv { font: 700 21px/1 var(--f-display); letter-spacing: .02em; }
  .se { color: var(--mute); font-size: 12px; text-align: right; }
  .pr { background: var(--gold); color: #1a1200; font: 700 12px/1 var(--f-display); letter-spacing: .08em; padding: 3px 6px; border-radius: 5px; margin-left: 8px; vertical-align: 3px; }
  .x { background: none; border: 0; color: var(--mute); font-size: 16px; padding: 4px 8px; border-radius: 8px; }
  .x:hover { color: var(--danger); }
  .empty { color: var(--mute); }
  .ex-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .try { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; text-align: left; }
  .try:hover { border-color: var(--accent); }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .dock-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .rest { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface2); border-radius: 10px; padding: 6px 10px; }
  .rest .t { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .rest.done .t { color: var(--good); }
  .mini { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 14px; }
  .quick { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .quick .last { color: var(--mute); font-size: 12px; white-space: nowrap; margin-right: 2px; }
  .quick .mini { white-space: nowrap; font-weight: 600; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 500 16px var(--f-body); }
  input[type=text]:focus { border-color: var(--accent); outline: none; }
  .mic, .go { border: 0; border-radius: 12px; width: 52px; flex: none; font-size: 20px; }
  .mic { background: var(--surface2); border: 1px solid var(--line); }
  .mic.on { background: var(--danger); color: #fff; animation: pulse 1.1s infinite; }
  .go { background: var(--accent); color: var(--accent-ink); font: 700 16px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,112,112,.55); } 100% { box-shadow: 0 0 0 16px rgba(255,112,112,0); } }
  .heard { color: var(--mute); font-size: 13px; min-height: 18px; }

  #toast { position: fixed; left: 50%; bottom: calc(190px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; z-index: 8; transition: all .25s; }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
  #toast.gold { background: var(--gold); color: #1a1200; }

  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .grid4 b { display: block; font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .grid4 span { color: var(--mute); font-size: 12px; }
  .pick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pick button { border: 1px solid var(--line); background: var(--surface2); border-radius: 99px; padding: 4px 11px; font-size: 13px; }
  .pick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  svg.ch { width: 100%; height: auto; display: block; overflow: visible; }
  .ch text { fill: var(--mute); font: 500 10px var(--f-body); }
  .ch .grid { stroke: var(--line); stroke-width: 1; }
  .ch .bar { fill: var(--accent); opacity: .45; }
  .ch .bar.today { opacity: 1; }
  .ch .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .ch .area { fill: var(--accent); opacity: .12; }
  .ch .dot { fill: var(--accent); }
  .ch .dot.pr { fill: var(--gold); }
  .ch .val { fill: var(--text); font-weight: 600; }
  .mrow { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
  .mbar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .mbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .prrow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .prrow:first-of-type { border-top: 0; }
  .prrow b { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
  .tip { color: var(--mute); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Voice<span>Lift</span></div>
      <div class="chips">
        <span class="chip" id="streak">0 day streak</span>
        <button class="chip btn" id="unit" aria-label="Switch kilograms and pounds">kg</button>
      </div>
    </div>
    <div class="xpbar"><i id="xpbar"></i></div>
    <div class="xplbl"><span id="lvl">Level 1</span><span id="xptxt">0 / 100 XP</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-log" aria-selected="true" data-tab="log">Log</button>
      <button role="tab" id="tab-stats" aria-selected="false" data-tab="stats">Stats</button>
    </div>
  </header>
  <main id="main" class="stack"></main>
</div>

<div id="toast" role="status"></div>

<div class="dock">
  <div class="dock-in">
    <div class="rest" id="rest" hidden>
      <span class="tip" id="restlbl">Rest</span><span class="t" id="rest-t">1:30</span>
      <span><button class="mini" data-act="rest+">+15s</button> <button class="mini" data-act="rest-skip">Skip</button></span>
    </div>
    <div class="quick" id="quick"></div>
    <div class="heard" id="heard"></div>
    <form id="form" autocomplete="off">
      <button type="button" class="mic" id="mic" aria-label="Dictate with the microphone">&#127908;</button>
      <input type="text" id="cmd" placeholder="Say it: 3x10 incline press, 24 kilos" enterkeyhint="send" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Exercise to log">
      <button type="submit" class="go">Log</button>
    </form>
  </div>
</div>

<script>
(function () {
  var KEY = 'voicelift.v2', LB = 0.45359237;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var dk = function (d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var addDays = function (n) { var d = new Date(); d.setDate(d.getDate() + n); return d; };
  var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  var S = { sets: [], unit: 'kg', tab: 'log', seeded: false, pick: '' };
  try { var r0 = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r0 && Array.isArray(r0.sets)) S = Object.assign(S, r0); } catch (e) {}
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  // ---------- numbers & names ----------
  var ONES = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  var TENS = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
  function wordsToDigits(s) {
    var t = s.split(/\s+/), out = [];
    for (var i = 0; i < t.length; i++) {
      var w = t[i], nx = t[i + 1];
      if (w === 'one' && /^(arm|leg|legged|handed|hand)$/.test(nx || '')) { out.push(w); continue; }
      if (w in TENS) {
        var n = TENS[w];
        if (nx in ONES && ONES[nx] > 0 && ONES[nx] < 10) { n += ONES[nx]; i++; }
        out.push(n);
      } else if (w in ONES) {
        var m = ONES[w];
        if (nx === 'hundred') { m *= 100; i++; if (t[i + 1] in TENS) { m += TENS[t[++i]]; } }
        out.push(m);
      } else out.push(w);
    }
    return out.join(' ');
  }
  var e1 = function (r) { return r.weight > 0 && r.reps > 0 ? r.weight * (1 + r.reps / 30) : 0; };
  var nameOf = function (r) { return cap((r.variation ? r.variation + ' ' : '') + r.ex); };
  var keyOf = function (r) { return nameOf(r).toLowerCase(); };
  var dispW = function (kg) { var v = S.unit === 'kg' ? kg : kg / LB; return String(Math.round(v * 2) / 2); };
  var wLabel = function (kg) { return kg > 0 ? dispW(kg) + ' ' + S.unit : 'BW'; };
  function setLabel(r) {
    var p = [];
    if (r.reps) p.push(r.weight > 0 ? wLabel(r.weight) + ' × ' + r.reps : r.reps + ' reps');
    else if (r.weight > 0) p.push(wLabel(r.weight));
    if (r.secs) p.push(Math.floor(r.secs / 60) + ':' + String(r.secs % 60).padStart(2, '0'));
    if (r.dist) p.push(r.dist + ' ' + r.distUnit);
    return p.join(' · ') || '1 rep';
  }

  // ---------- parsing ----------
  var VARS = /\b(incline|decline|flat|wide grip|close grip|narrow grip|neutral grip|wide|close|narrow|reverse|seated|standing|single arm|one arm|single leg|one leg|dumbbells?|barbell|cable|machine|smith|bulgarian|front|sumo|romanian|paused|tempo|underhand|overhand|hammer|goblet|zercher|hack)\b/g;
  var FILLER = /\b(i|ive|im|did|do|done|just|add|log|track|had|performed|completed|finished|some|of|at|with|using|for|and|then|the|a|an|my|today|set|sets|rep|reps|please|weighing|weight|hey|ok|okay|so|now|made|make|this|that|it|its|different|position|going|go|to|on|next|kilo|kilos|kg|kgs|pounds|lbs|time|times|x|by|got|was|were|new|more)\b/g;
  var ALIAS = [[/^bench$/, 'bench press'], [/^(ohp|military press|overhead press)$/, 'shoulder press'], [/^dead$/, 'deadlift'], [/^(pullup|pull up|chin up|chinup)$/, 'pull up'], [/^(pushup|push up)$/, 'push up'], [/^(lat pulldown|pulldown)$/, 'lat pulldown'], [/^(bicep curl|biceps curl)$/, 'curl'], [/^(tricep extension|triceps extension)$/, 'tricep extension'], [/^(sit up|situp)$/, 'sit up']];
  function sing(w) { if (w === 'abs') return w; if (/(ss|us)$/.test(w)) return w; if (/(ch|sh|x|ss)es$/.test(w)) return w.slice(0, -2); return w.replace(/s$/, ''); }

  function parse(raw) {
    var s = ' ' + wordsToDigits(raw.toLowerCase().replace(/'/g, '').replace(/[,.!?]/g, ' ').replace(/-/g, ' ')) + ' ';
    var e = { sets: 1, reps: 0, weight: 0, secs: 0, dist: 0, distUnit: '', name: '', variation: '' };
    var m, hasNum = false;
    function cut(re) { var x = s.match(re); if (x) { s = s.replace(re, ' '); hasNum = true; } return x; }
    if ((m = cut(/(\d+(?:\.\d+)?)\s*(kg|kgs|kilos?|kilograms?)\b/))) e.weight = +m[1];
    else if ((m = cut(/(\d+(?:\.\d+)?)\s*(lbs?|pounds?)\b/))) e.weight = +m[1] * LB;
    if ((m = cut(/(\d+(?:\.\d+)?)\s*(km|kilometers?|kilometres?|k|miles?|mi)\b/))) { e.dist = +m[1]; e.distUnit = /^mi/.test(m[2]) ? 'mi' : 'km'; }
    if ((m = cut(/(\d+(?:\.\d+)?)\s*(minutes?|mins?|m)\b/))) e.secs += Math.round(+m[1] * 60);
    if ((m = cut(/(\d+)\s*(seconds?|secs?|s)\b/))) e.secs += +m[1];
    if ((m = cut(/(\d+)\s*(?:sets?\s*(?:of)?|x|times|by)\s*(\d+)/))) { e.sets = +m[1]; e.reps = +m[2]; }
    else if ((m = cut(/(\d+)\s*(?:reps?|repetitions?|times)\b/))) e.reps = +m[1];
    else if ((m = cut(/(\d+)\s*sets?\b/))) e.sets = +m[1];
    var unitW = S.unit === 'kg' ? 1 : LB;
    if (e.reps && !e.weight && (m = s.match(/\b(\d+(?:\.\d+)?)\b/))) { e.weight = +m[1] * unitW; s = s.replace(m[0], ' '); }
    if (!e.reps && !e.secs && !e.dist && (m = s.match(/^\s*(\d+)\s+(?=[a-z])/))) { e.reps = +m[1]; s = s.replace(m[0], ' '); hasNum = true; }
    if (!e.reps && !e.secs && !e.dist && (m = s.match(/\b(\d+)\b/))) { if (e.weight) e.reps = +m[1]; else e.reps = +m[1]; s = s.replace(m[0], ' '); hasNum = true; }

    var verb = (s.match(/\b(ran|run|walked|walk|cycled|swam)\b/) || [])[1];
    var vars = [];
    s = s.replace(VARS, function (x) { x = x.replace(/dumbbells/, 'dumbbell'); if (vars.indexOf(x) < 0) vars.push(x); return ' '; });
    var name = s.replace(FILLER, ' ').replace(/\b(ran|run|walked|walk|cycled|swam)\b/g, ' ').replace(/\b\d+(\.\d+)?\b/g, ' ').replace(/\s+/g, ' ').trim();
    if (!name && verb) name = { ran: 'run', run: 'run', walked: 'walk', walk: 'walk', cycled: 'cycle', swam: 'swim' }[verb];
    if (name) {
      var w = name.split(' '); w[w.length - 1] = sing(w[w.length - 1]); name = w.join(' ');
      if (name === 'rdl') { name = 'deadlift'; if (vars.indexOf('romanian') < 0) vars.push('romanian'); }
      ALIAS.forEach(function (a) { if (a[0].test(name)) name = a[1]; });
    }
    e.name = name; e.variation = vars.join(' ');
    if (!name && !hasNum && !e.variation) return null;
    return e;
  }

  var lastSet = function () { return S.sets.length ? S.sets.slice().sort(function (a, b) { return a.ts - b.ts; }).pop() : null; };

  // Turn a parse into a loggable template, borrowing from the last set when the speaker left things out.
  function fill(e, last) {
    var t = { sets: Math.max(1, Math.min(20, e.sets || 1)), reps: e.reps, weight: e.weight, secs: e.secs, dist: e.dist, distUnit: e.distUnit, variation: e.variation };
    if (e.name) { t.ex = e.name; if (!t.reps && !t.secs && !t.dist) t.reps = 1; return t; }
    if (!last) return null;
    t.ex = last.ex; if (!t.variation) t.variation = last.variation;
    if (!t.reps && !t.secs && !t.dist) { t.reps = last.reps; t.secs = last.secs; t.dist = last.dist; t.distUnit = last.distUnit; }
    if (!t.weight) t.weight = last.weight;
    return t;
  }

  // ---------- scoring ----------
  var MUSCLE = [[/squat|leg press|lunge|calf|leg curl|leg extension|hip thrust|step up/, 'Legs'], [/deadlift|row|pull up|pulldown|chin up|shrug|face pull/, 'Back'], [/bench|push up|chest|fly|dip/, 'Chest'], [/shoulder|lateral raise|overhead|arnold/, 'Shoulders'], [/\bpress\b/, 'Chest'], [/curl|tricep|skull|pushdown|extension/, 'Arms'], [/plank|crunch|sit up|\babs\b|leg raise|core/, 'Core'], [/\brun\b|walk|cycle|swim|bike/, 'Cardio']];
  function muscleOf(r) { var k = (r.ex + ' ' + r.variation); for (var i = 0; i < MUSCLE.length; i++) if (MUSCLE[i][0].test(k)) return MUSCLE[i][1]; return 'Other'; }
  function score(r, prior) {
    var key = keyOf(r), pr = false;
    if (r.weight > 0 && r.reps > 0) {
      var best = prior.filter(function (p) { return keyOf(p) === key; }).reduce(function (a, p) { return Math.max(a, e1(p)); }, 0);
      pr = best > 0 && e1(r) > best + 0.01;
    }
    var vol = r.reps * r.weight;
    var xp = 10 + Math.min(40, Math.round(vol / 40)) + (r.weight ? 0 : Math.round(Math.min(r.reps, 20) / 2)) + Math.round(r.secs / 10) + Math.round(r.dist * (r.distUnit === 'mi' ? 25 : 15)) + (pr ? 50 : 0);
    return { xp: xp, pr: pr };
  }
  var totalXp = function () { return S.sets.reduce(function (a, s) { return a + (s.xp || 0); }, 0); };

  }
  mic.addEventListener('click', function () {
    if (blocked || !rec) { micTip(); $('cmd').focus(); return; }
    try { listening ? rec.stop() : rec.start(); } catch (e) { blocked = true; micTip(); }
  });

  render();
})();
</script>

</body>
</html>
